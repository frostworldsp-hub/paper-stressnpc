name: Build Paper 1.16.5 plugin

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Download BuildTools
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 10 \
            -A "Mozilla/5.0" \
            -o BuildTools.jar \
            https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
          ls -lh BuildTools.jar

      - name: Build Spigot 1.16.5
        run: |
          set -euxo pipefail
          java -jar BuildTools.jar --rev 1.16.5
          test -f spigot-1.16.5-R0.1-SNAPSHOT.jar
          ls -lh spigot-1.16.5-R0.1-SNAPSHOT.jar

      - name: Install Spigot artifact into local Maven repository
        run: |
          set -euxo pipefail
          mvn -B install:install-file \
            -Dfile=spigot-1.16.5-R0.1-SNAPSHOT.jar \
            -DgroupId=org.spigotmc \
            -DartifactId=spigot \
            -Dversion=1.16.5-R0.1-SNAPSHOT \
            -Dpackaging=jar \
            -DgeneratePom=true \
            -DcreateChecksum=true

      - name: Build plugin with Maven
        run: mvn -B clean package

      - name: Upload built JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-stressnpc-jar
          path: target/*.jar
