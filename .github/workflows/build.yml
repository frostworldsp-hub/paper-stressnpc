name: Build Paper 1.16.5 plugin

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build plugin with Maven
        run: mvn -B clean package

      - name: Upload built JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-stressnpc-jar
          path: target/*.jar
